*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0A1628;color:#F5F2EB;font-family:'Georgia',serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.box{max-width:480px;width:100%;text-align:center;}

.btn:hover{background:#E2C98A;}
.btn:disabled{background:rgba(197,160,89,.3);color:rgba(10,22,40,.4);cursor:not-allowed;}
.log{margin-top:16px;background:rgba(0,0,0,.4);border:1px solid rgba(197,160,89,.15);padding:14px;border-radius:2px;text-align:left;font-family:monospace;font-size:12px;line-height:1.8;min-height:60px;display:none;max-height:200px;overflow-y:auto;}
.lok{color:#4ade80;}.lerr{color:#f87171;}.linf{color:#E2C98A;}
.result{margin-top:20px;padding:18px;background:rgba(197,160,89,.08);border:2px solid #C5A059;border-radius:2px;display:none;}
.result a{color:#C5A059;font-size:18px;font-weight:700;word-break:break-all;}
.result .creds{margin-top:12px;font-size:12px;color:rgba(245,242,235,.7);line-height:2;}
.progress{height:4px;background:rgba(197,160,89,.1);border-radius:2px;margin-top:12px;overflow:hidden;}
.progress-bar{height:4px;background:#C5A059;width:0%;transition:width .3s;border-radius:2px;}
.step{font-size:12px;color:#8B6E3A;margin-top:6px;letter-spacing:.5px;}

function log(msg, cls='linf'){
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.innerHTML += `<div class="${cls}">${new Date().toLocaleTimeString('pt-BR')} → ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function prog(pct, txt){
  document.getElementById('prog').style.width = pct + '%';
  if(txt) document.getElementById('step').textContent = txt;
}

async function decompress(b64){
  // Decodificar base64 para bytes
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  
  // Descomprimir gzip via DecompressionStream
  const stream = new DecompressionStream('gzip');
  const writer = stream.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const reader = stream.readable.getReader();
  const chunks = [];
  while(true){
    const {done,value} = await reader.read();
    if(done) break;
    chunks.push(value);
  }
  const total = chunks.reduce((a,b)=>a+b.length,0);
  const result = new Uint8Array(total);
  let offset=0;
  for(const chunk of chunks){ result.set(chunk,offset); offset+=chunk.length; }
  return new TextDecoder().decode(result);
}

async function deployar(){
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Processando...';
  
  try{
    // PASSO 1: Descomprimir o sistema
    log('Preparando o Sistema Modo Deus v6...');
    prog(10, 'Descomprimindo sistema...');
    const htmlContent = await decompress(SISTEMA_B64);
    log(`✓ Sistema descomprimido (${Math.round(htmlContent.length/1024)}KB)`, 'lok');
    
    // PASSO 2: Criar ZIP via JSZip
    prog(25, 'Criando pacote de deploy...');
    log('Criando pacote ZIP...');
    const zip = new JSZip();
    zip.file('index.html', htmlContent);
    const zipBlob = await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
    log(`✓ Pacote criado (${Math.round(zipBlob.size/1024)}KB)`, 'lok');
    
    // PASSO 3: Deploy no Netlify
    prog(45, 'Enviando para Netlify...');
    log('Enviando para Netlify (deploy anônimo)...');
    
    const formData = new FormData();
    formData.append('file', zipBlob, 'site.zip');
    
    const resp = await fetch('https://api.netlify.com/api/v1/sites', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/zip',
      },
      body: zipBlob,
    });
    
    prog(70, 'Processando resposta...');
    const data = await resp.json();
    
    if(resp.ok && (data.url || data.deploy_url || data.ssl_url || data.id)){
      const url = data.ssl_url || data.url || data.deploy_url || `https://${data.subdomain}.netlify.app`;
      log(`✓ Deploy realizado! ID: ${data.id}`, 'lok');
      prog(85, 'Aguardando site ficar online...');
      
      // Aguardar o site ficar acessível
      log('Aguardando publicação (pode levar 15-30s)...');
      let online = false;
      for(let i=0;i<10;i++){
        await new Promise(r=>setTimeout(r,3000));
        try{
          const check = await fetch(url, {mode:'no-cors'});
          online = true;
          break;
        }catch(e){ }
        log(`Verificando... (${i+1}/10)`);
      }
      
      prog(100, 'Pronto!');
      log(`✓ SISTEMA NO AR: ${url}`, 'lok');
      
      // Mostrar resultado
      document.getElementById('link').href = url;
      document.getElementById('link').textContent = url;
      document.getElementById('result').style.display = 'block';
      btn.textContent = '✓ Deploy Realizado!';
      
    } else {
      throw new Error(data.message || data.error || `Status ${resp.status}: ${JSON.stringify(data).slice(0,100)}`);
    }
    
  } catch(err) {
    log(`✗ Erro: ${err.message}`, 'lerr');
    log('Tentando método alternativo...', 'linf');
    
    // Método alternativo: usar Netlify CLI endpoint diferente
    await tentarMetodoAlternativo();
    
    btn.disabled = false;
    btn.textContent = '↺ Tentar Novamente';
  }
}

async function tentarMetodoAlternativo(){
  try{
    log('Método 2: Netlify Form Upload...');
    const htmlContent = await decompress(SISTEMA_B64);
    
    // Criar um blob com o HTML diretamente
    const blob = new Blob([htmlContent], {type:'text/html'});
    
    // Tentar outro endpoint do Netlify
    const fd = new FormData();
    fd.append('files[index.html]', blob, 'index.html');
    
    const r = await fetch('https://app.netlify.com/api/v1/sites', {
      method:'POST',
      body: blob,
      headers:{'Content-Type':'text/html'}
    });
    
    if(r.ok){
      const d = await r.json();
      const url = d.ssl_url || d.url;
      if(url){
        log(`✓ Deploy realizado: ${url}`, 'lok');
        document.getElementById('link').href = url;
        document.getElementById('link').textContent = url;
        document.getElementById('result').style.display = 'block';
        return;
      }
    }
    
    throw new Error('Ambos os métodos falharam');
    
  } catch(e) {
    log(`✗ ${e.message}`, 'lerr');
    log('─────────────────────────────', 'linf');
    log('SOLUÇÃO MANUAL (30 segundos):', 'lok');
    log('1. Abra netlify.com/drop no navegador', 'linf');
    log('2. Arraste o arquivo adiel_rios_v6_definitivo.html', 'linf');
    log('3. Copie o link que aparecer', 'linf');
  }
}
